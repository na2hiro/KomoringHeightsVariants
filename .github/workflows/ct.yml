name: ct

on:
  pull_request:
  workflow_dispatch:

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.make-matrix.outputs.matrix }}
      enabled: ${{ steps.credentials.outputs.enabled }}
    steps:
      - name: Check for Google Drive test credentials
        id: credentials
        env:
          SKICKA_TOKENCACHE_JSON: ${{ secrets.SKICKA_TOKENCACHE_JSON }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [[ -n "$SKICKA_TOKENCACHE_JSON" && -n "$GOOGLE_CLIENT_ID" && -n "$GOOGLE_CLIENT_SECRET" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Google Drive test credentials are unavailable. Skipping the private test corpus."
          fi

      - name: Download from Google Drive
        if: steps.credentials.outputs.enabled == 'true'
        uses: satackey/action-google-drive@v1
        with:
          skicka-tokencache-json: ${{ secrets.SKICKA_TOKENCACHE_JSON }}
          download-from: /kh-test-resources
          download-to: ./test-resources
          google-client-id: ${{ secrets.GOOGLE_CLIENT_ID }}
          google-client-secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      - name: Make matrix
        id: make-matrix
        if: steps.credentials.outputs.enabled == 'true'
        run: |
          list=$(find test-resources -maxdepth 1 -type f -printf '%f\n' | sort | jq -cnR '[inputs | select(length>0)]')
          if [[ "$list" == '[]' ]]; then
            echo "::error::No test cases found in the Google Drive corpus."
            exit 1
          fi
          echo "matrix=$list" >> "$GITHUB_OUTPUT"

  tests:
    runs-on: ubuntu-latest
    needs: prepare-matrix
    if: needs.prepare-matrix.outputs.enabled == 'true'
    strategy:
      matrix:
        yaml: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}

    steps:
      - name: Download from Google Drive
        uses: satackey/action-google-drive@v1
        with:
          skicka-tokencache-json: ${{ secrets.SKICKA_TOKENCACHE_JSON }}
          download-from: /kh-test-resources/${{ matrix.yaml }}
          download-to: ./
          google-client-id: ${{ secrets.GOOGLE_CLIENT_ID }}
          google-client-secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      - name: Checkout mate-engine-test
        uses: actions/checkout@v3
        with:
          repository: komori-n/mate-engine-test.git
          path: mate-engine-test
          ref: main

      - name: Checkout KomoringHeights
        uses: actions/checkout@v3
        with:
          path: KomoringHeights

      - name: Setup environment
        run: |
          sudo apt-get update && sudo apt-get -y install build-essential g++ npm
          sudo npm install -g @bazel/bazelisk

      - name: Build KomoringHeights
        run: |
          pushd KomoringHeights/source
          make -j4 normal TARGET_CPU=SSE42 COMPILER=g++ YANEURAOU_EDITION=USER_ENGINE
          popd

      - name: Run tests
        run: |
          cd mate-engine-test
          bazelisk run :gazelle
          bazelisk run --run_under="cd $PWD &&" \
            cmd/mate-engine-test:mate-engine-test -- \
            -e ../KomoringHeights/source/KomoringHeights-by-gcc \
            -f ../${{ matrix.yaml }} \
            -t 30000 \
            --exit-on-fail

  # This job is used for status check. It becomes success iff all of the above
  # jobs returned success.
  check:
    runs-on: ubuntu-latest
    needs: [prepare-matrix, tests]
    if: always()
    steps:
      - name: Check Build Status
        env:
          PREPARE_RESULT: ${{ needs.prepare-matrix.result }}
          TEST_RESULT: ${{ needs.tests.result }}
          ENABLED: ${{ needs.prepare-matrix.outputs.enabled }}
        run: |
          [[ "$PREPARE_RESULT" == success ]] &&
            { [[ "$ENABLED" == false && "$TEST_RESULT" == skipped ]] || [[ "$TEST_RESULT" == success ]]; }
