# mainline Windows build
name: Make CI (MSYS2 for Windows)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-msys2-windows:
    runs-on: windows-latest

    strategy:
      matrix:
        compiler: [clang++, g++]
        archcpu:
          - "AVX512VNNI AVXVNNI AVX512 AVX2"
          - "SSE42 SSE41 SSSE3"
          - "SSE2 ZEN1 ZEN2 ZEN3"

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-lld

      - name: Build Windows binaries
        shell: msys2 {0}
        env:
          COMPILER: ${{ matrix.compiler }}
          CPU_TARGETS: ${{ matrix.archcpu }}
        run: |
          set -euo pipefail
          mkdir -p build/windows
          for cpu in $CPU_TARGETS; do
            for target in normal tournament; do
              name=KomoringHeights-${COMPILER}-${target}-${cpu}
              make -C source -j2 "$target" OS=Windows_NT COMPILER="$COMPILER" TARGET_CPU="$cpu" \
                OBJDIR="../obj-${name}" TARGET="../build/windows/${name}.exe"
            done
          done

      - uses: actions/upload-artifact@v4
        with:
          name: build-windows-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: build/windows/*.exe
