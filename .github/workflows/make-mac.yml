# for Mac environment
name: Make CI (for Mac)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: macos-15-intel
            archcpu: "AVX512,AVX2,SSE42,SSE2"
          - os: macos-15-intel
            archcpu: "SSE41,SSSE3,OTHER"
          - os: macos-15
            archcpu: "M1"

    steps:
      - name: Checkout own repository
        uses: actions/checkout@v2
        with:
          path: main

      - name: make
        run: ./main/script/build.sh -e USER_ENGINE -c clang++ -t normal -a ${{ matrix.archcpu }} -o mac

      - uses: actions/upload-artifact@v4
        with:
          name: build-mac-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: ./main/build/**/**/*
